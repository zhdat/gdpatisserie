name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gduser
          POSTGRES_PASSWORD: securepass
          POSTGRES_DB: gdpatisserie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      - name: Setup Database (Push Schema)
        env:
          DATABASE_URL: postgres://gduser:securepass@localhost:5432/gdpatisserie_test
        run: npx prisma@6 db push

      # 👇 AJOUT ICI : ON REMPLIT LA BASE DE DONNÉES
      - name: Seed Database
        env:
          DATABASE_URL: postgres://gduser:securepass@localhost:5432/gdpatisserie_test
          # On utilise la commande "transpile-only" pour éviter les erreurs TS strictes en CI
        run: npx ts-node --transpile-only --compiler-options '{"module":"CommonJS","target":"ES2020","moduleResolution":"Node"}' prisma/seed.ts

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        env:
          DATABASE_URL: postgres://gduser:securepass@localhost:5432/gdpatisserie_test
          AUTH_SECRET: "secret-pour-les-tests-ci"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "demo"
          RESEND_API_KEY: "re_123456"
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30