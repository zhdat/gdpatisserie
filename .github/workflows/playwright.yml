name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # 👇 1. ON CRÉE UNE BASE DE DONNÉES TEMPORAIRE
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gduser
          POSTGRES_PASSWORD: securepass
          POSTGRES_DB: gdpatisserie_test
        ports:
          - 5432:5432
        # On attend que la BDD soit prête avant de lancer la suite
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm install -g pnpm && pnpm install

      # 👇 2. ON INITIALISE LA BDD
      - name: Setup Database
        # On force l'URL de connexion vers le service créé au-dessus
        env:
          DATABASE_URL: postgres://gduser:securepass@localhost:5432/gdpatisserie_test
        run: npx prisma@6 db push

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # 👇 3. ON LANCE LES TESTS AVEC LES VARIABLES D'ENVIRONNEMENT
      - name: Run Playwright tests
        env:
          # URL de la BDD temporaire
          DATABASE_URL: postgres://gduser:securepass@localhost:5432/gdpatisserie_test
          # Clés fictives pour que Next.js ne plante pas au démarrage
          AUTH_SECRET: "secret-pour-les-tests-ci"
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: "demo"
          RESEND_API_KEY: "re_123456"
        run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30