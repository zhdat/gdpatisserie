  db:
    image: postgres:15-alpine
    container_name: gdpatisserie-db
    environment:
      POSTGRES_USER: gilles
      POSTGRES_PASSWORD: 3c8S2C5HhsN
      POSTGRES_DB: gdpatisserie_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: gdpatisserie-storage
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # Port de l'API S3
      - "9001:9001" # Port de la console Web
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres-data: