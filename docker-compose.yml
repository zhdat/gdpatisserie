services:
  app:
    build: .
    container_name: gd-app-prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - db
      - minio

  db:
    image: postgres:15-alpine
    container_name: gdpatisserie-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gdpatisserie_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # --- LE NOUVEAU SERVICE CADDY ---
  caddy:
    image: caddy:2
    container_name: gdpatisserie-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ~/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  caddy_data:
  caddy_config: