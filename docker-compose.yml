# docker-compose.yml
version: '3.8'

services:
  # Ton application (L'image que tu as construite)
  app:
    image: calliste/gdpatisserie:latest # 👈 Mets ton pseudo ici
    container_name: gd-app-test
    ports:
      - "3000:3000"
    environment:
      # ATTENTION : Ici on utilise "db" comme nom d'hôte, pas localhost
      - DATABASE_URL=postgresql://myuser:mypassword@db:5432/gdpatisserie_db
      # --- AJOUTE CES LIGNES ---
      # Dit à NextAuth quelle est l'adresse réelle du site
      - AUTH_URL=http://localhost:3000

      # Dit à NextAuth de faire confiance au localhost (indispensable en Docker)
      - AUTH_TRUST_HOST=true
      # -------------------------

      # On passe tes clés API (Remplace par les valeurs de ton .env ou utilise env_file)
      - AUTH_SECRET=${AUTH_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: gdpatisserie-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: gdpatisserie_db
    ports:
      - "5432:5432" # On ouvre le port 5432 (standard Postgres)
    volumes:
      - ./postgres-data:/var/lib/postgresql/data # IMPORTANT : Cela permet de garder les données même si tu éteins Docker

volumes:
  postgres-data: